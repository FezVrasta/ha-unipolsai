[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyunipolsai"
version = ""
description = "Async client for the Unipol (UnipolSai) Unibox telematics API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Federico Zivolo" }]
keywords = ["unipol", "unipolsai", "unibox", "telematics", "gps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/fezvrasta/ha-unipolsai"
Issues = "https://github.com/fezvrasta/ha-unipolsai/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aioresponses>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyunipolsai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
